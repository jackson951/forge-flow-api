services:
  postgres:
    image: postgres:17-alpine
    container_name: flowforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      # Local development only. Never reuse this default outside your machine.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowforge}
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}

    ports:
      # Windows already has PostgreSQL on 5432.
      # Host 5433 -> container 5432.
      # Bound to localhost so the dev database is not exposed on the network.
      - "127.0.0.1:5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-flowforge} -d ${POSTGRES_DB:-flowforge}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - flowforge-network


  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redisdata:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    networks:
      - flowforge-network


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: flowforge-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production

      # IMPORTANT:
      # Inside Docker, use service names rather than localhost.
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://flowforge:flowforge@postgres:5432/flowforge?schema=public}

      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - flowforge-network

    profiles:
      - full


  worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: flowforge-worker
    restart: unless-stopped

    command:
      - node
      - dist/worker.js

    env_file:
      - .env

    environment:
      NODE_ENV: production

      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://flowforge:flowforge@postgres:5432/flowforge?schema=public}

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - flowforge-network

    profiles:
      - full


volumes:
  pgdata:
    name: flowforge-pgdata

  redisdata:
    name: flowforge-redisdata


networks:
  flowforge-network:
    name: flowforge-network
    driver: bridge