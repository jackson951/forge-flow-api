name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
          POSTGRES_DB: flowforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowforge -d flowforge"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    # Throwaway values for the ephemeral CI services only.
    env:
      DATABASE_URL: postgresql://flowforge:flowforge@localhost:5432/flowforge?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789abcdef

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Quality gate (docs/backend/19-TESTING-AND-QUALITY-GATE.md). Every step must pass.
      - name: 1. Install
        run: npm ci
      - name: 2. Prisma schema and migrations on a fresh database
        run: |
          npx prisma generate
          npx prisma validate
          npx prisma migrate deploy
      - name: 3. Format, lint, typecheck
        run: |
          npx prettier --check "src/**/*.ts" "test/**/*.ts"
          npm run lint
          npm run typecheck
          npx tsc --noEmit -p tsconfig.spec.json
      - name: 4. Unit tests + per-area coverage thresholds
        run: npm run test:cov
      - name: 5-6. Unit, integration and E2E suites together + global coverage floor
        run: npm run test:all
      - name: 7. Build
        run: npm run build
      - name: 8. Dependency audit (high and critical)
        run: npm audit --audit-level=high
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
